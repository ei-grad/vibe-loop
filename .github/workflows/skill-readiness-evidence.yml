name: Skill Release Readiness Evidence

on:
  workflow_dispatch:
    inputs:
      record_json:
        description: Compact JSON from an exact-head vibe-loop eval release-gate run
        required: true
        type: string

permissions:
  contents: read

jobs:
  evidence:
    name: Validate and retain exact-head readiness record
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Validate record envelope
        env:
          RECORD_JSON: ${{ inputs.record_json }}
          RELEASE_HEAD: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          record = json.loads(os.environ["RECORD_JSON"])
          head = os.environ["RELEASE_HEAD"]
          if record.get("schema_version") != 2:
              raise SystemExit("readiness schema version is unsupported")
          if record.get("record_type") != "skill_release_readiness":
              raise SystemExit("readiness record type is invalid")
          if record.get("status") != "passed":
              raise SystemExit("readiness status is not passed")
          revision = record.get("revision", {})
          if revision.get("head") != head or not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("readiness head does not match the workflow revision")
          base = revision.get("base")
          if not isinstance(base, str) or not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("readiness base is malformed")
          skills = record.get("bundled_skills")
          if not isinstance(skills, dict) or not skills:
              raise SystemExit("bundled skill fingerprints are missing")
          with open("release-readiness.json", "w", encoding="utf-8") as output:
              json.dump(record, output, indent=2, sort_keys=True)
              output.write("\n")
          PY

      - name: Build exact source and wheel distributions
        run: uv build

      - name: Reproduce classification and validate complete readiness evidence
        run: |
          uv run vibe-loop eval release-classify --repo . \
            --output release-classification.json
          python - <<'PY'
          import json

          with open("release-classification.json", encoding="utf-8") as handle:
              classification = json.load(handle)
          if classification["status"] != "readiness_required":
              raise SystemExit("the exact revision does not require readiness evidence")
          PY
          uv run python - <<'PY'
          import json
          from pathlib import Path

          from vibe_loop.release_admission import validate_readiness_record

          with open("release-classification.json", encoding="utf-8") as handle:
              classification = json.load(handle)
          with open("release-readiness.json", encoding="utf-8") as handle:
              readiness = json.load(handle)
          diagnostics = validate_readiness_record(
              readiness,
              classification=classification,
              distributions=tuple(sorted(Path("dist").iterdir())),
          )
          if diagnostics:
              raise SystemExit("readiness validation blocked: " + "; ".join(diagnostics))
          PY

      - name: Upload immutable exact-head readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-release-readiness-${{ github.sha }}
          path: release-readiness.json
          if-no-files-found: error
          retention-days: 30
