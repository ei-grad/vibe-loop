name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        required: true
        default: TestPyPI
        type: choice
        options:
          - TestPyPI
          - PyPI
      readiness_run_id:
        description: Optional workflow run containing exact-head skill readiness evidence
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

jobs:
  build:
    name: Build distributions
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Run documentation gate
        run: make doc-budget

      - name: Reject PyPI dispatch without a release tag
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.target == 'PyPI' &&
          !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "PyPI publishing requires running this workflow from a v* tag."
          exit 1

      - name: Reject TestPyPI dispatch outside main or release tags
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.target == 'TestPyPI' &&
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TestPyPI publishing requires running this workflow from main or a v* tag."
          exit 1

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(
            python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as pyproject:
              print(tomllib.load(pyproject)["project"]["version"])
          PY
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag version $tag_version does not match pyproject.toml version $version."
            exit 1
          fi

      - name: Build source and wheel distributions
        run: uv build

      - name: Check package metadata
        run: uv run --with twine --no-project python -m twine check dist/*

      - name: List distributions
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in sorted(Path("dist").iterdir()):
              print(f"{path.name}\t{path.stat().st_size}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify uv interpreter
        shell: bash
        run: |
          actual="$(
            uv run --no-project python - <<'PY'
          import sys

          print(f"{sys.version_info.major}.{sys.version_info.minor}")
          PY
          )"
          if [ "$actual" != "$UV_PYTHON" ]; then
            echo "uv selected Python $actual, expected $UV_PYTHON."
            exit 1
          fi

      - name: Run tests against built wheel
        shell: bash
        run: uv run --no-project --with dist/*.whl python -m unittest discover -s tests

      - name: Smoke test console script
        shell: bash
        run: uv run --no-project --with dist/*.whl vibe-loop --help >/dev/null

  admission:
    name: Validate exact-revision release admission
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact release revision with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Classify exact release changes
        run: >-
          uv run vibe-loop eval release-classify --repo .
          --output release-classification.json --json

      - name: Resolve immutable exact-head readiness evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.readiness_run_id }}
        run: |
          if python - <<'PY'
          import json

          with open("release-classification.json", encoding="utf-8") as handle:
              classification = json.load(handle)
          raise SystemExit(classification["status"] != "readiness_required")
          PY
          then
            python - <<'PY'
          import io
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          api_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_json(url):
              request = urllib.request.Request(url, headers=api_headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          with open("release-classification.json", encoding="utf-8") as handle:
              head = json.load(handle)["head"]
          requested_run_id = os.environ.get("REQUESTED_RUN_ID", "").strip()
          workflow_url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/skill-readiness-evidence.yml"
          expected_workflow_id = api_json(workflow_url)["id"]
          query = f"?name=skill-release-readiness-{head}&per_page=100"
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts{query}"
          artifacts = api_json(url)["artifacts"]
          candidates = []
          for artifact in artifacts:
              workflow_run = artifact.get("workflow_run") or {}
              run_id = str(workflow_run.get("id", ""))
              if (
                  artifact["expired"]
                  or workflow_run.get("head_sha") != head
                  or (requested_run_id and run_id != requested_run_id)
              ):
                  continue
              run_url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
              run = api_json(run_url)
              run_path = str(run.get("path", "")).partition("@")[0]
              if (
                  run.get("head_sha") != head
                  or run.get("workflow_id") != expected_workflow_id
                  or run_path != ".github/workflows/skill-readiness-evidence.yml"
                  or run.get("event") != "workflow_dispatch"
                  or run.get("conclusion") != "success"
              ):
                  continue
              candidates.append(artifact)
          if not candidates:
              raise SystemExit("no validated exact-head readiness artifact was found")
          artifact = max(candidates, key=lambda item: item["created_at"])
          download = urllib.request.Request(
              artifact["archive_download_url"], headers=api_headers
          )
          opener = urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(download) as response:
                  archive_bytes = response.read()
          except urllib.error.HTTPError as exc:
              if exc.code not in {301, 302, 303, 307, 308}:
                  raise
              location = exc.headers.get("Location")
              exc.close()
              if not location:
                  raise SystemExit("readiness artifact redirect is missing a location")
              signed_url = urllib.parse.urljoin(
                  artifact["archive_download_url"], location
              )
              if urllib.parse.urlsplit(signed_url).scheme != "https":
                  raise SystemExit("readiness artifact redirect is not HTTPS")
              with urllib.request.urlopen(signed_url) as response:
                  archive_bytes = response.read()
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              names = archive.namelist()
              if names != ["release-readiness.json"]:
                  raise SystemExit("readiness artifact must contain only release-readiness.json")
              with open("release-readiness.json", "wb") as output:
                  output.write(archive.read(names[0]))
          PY
          fi

      - name: Build readiness admission
        if: hashFiles('release-readiness.json') != ''
        run: >-
          uv run vibe-loop eval release-admit --repo .
          --classification release-classification.json
          --readiness-record release-readiness.json
          --distribution dist/*.whl --distribution dist/*.tar.gz
          --output release-admission.json --json

      - name: Build unrelated-release exemption admission
        if: hashFiles('release-readiness.json') == ''
        run: >-
          uv run vibe-loop eval release-admit --repo .
          --classification release-classification.json
          --distribution dist/*.whl --distribution dist/*.tar.gz
          --output release-admission.json --json

      - name: Upload immutable publish admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-admission-${{ github.sha }}
          path: |
            release-classification.json
            release-readiness.json
            release-admission.json
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - admission
      - test
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'TestPyPI'
    runs-on: ubuntu-latest
    environment:
      name: TestPyPI
      url: https://test.pypi.org/project/vibe-loop/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact release history for admission verification
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Download publish admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-admission-${{ github.sha }}
          path: admission/

      - name: Verify transferred evidence and distributions
        shell: bash
        run: |
          readiness=()
          if [ -f admission/release-readiness.json ]; then
            readiness=(--readiness-record admission/release-readiness.json)
          fi
          uv run --no-project --with dist/*.whl vibe-loop eval release-admit \
            --repo . --classification admission/release-classification.json \
            "${readiness[@]}" --distribution dist/*.whl \
            --distribution dist/*.tar.gz --output admission/release-admission.json \
            --verify

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          print-hash: true
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs:
      - admission
      - test
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.target == 'PyPI' &&
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: PyPI
      url: https://pypi.org/project/vibe-loop/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out exact release history for admission verification
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Download publish admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-admission-${{ github.sha }}
          path: admission/

      - name: Verify transferred evidence and distributions
        shell: bash
        run: |
          readiness=()
          if [ -f admission/release-readiness.json ]; then
            readiness=(--readiness-record admission/release-readiness.json)
          fi
          uv run --no-project --with dist/*.whl vibe-loop eval release-admit \
            --repo . --classification admission/release-classification.json \
            "${readiness[@]}" --distribution dist/*.whl \
            --distribution dist/*.tar.gz --output admission/release-admission.json \
            --verify

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: true
          print-hash: true
